name: API tests
on:
  push:
    branches: [main]
    paths: ['services/api/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['services/api/**', '.github/workflows/api.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install './services/api[dev]'
      - run: pytest -q
        working-directory: services/api

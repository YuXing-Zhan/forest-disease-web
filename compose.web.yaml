services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - '127.0.0.1:8000:8000'
    env_file: .env.web
    environment:
      DATABASE_URL: sqlite+pysqlite:////data/forest.db
      UPLOAD_DIR: /data/uploads
    volumes:
      - forest-web-data:/data
    restart: unless-stopped
volumes:
  forest-web-data:

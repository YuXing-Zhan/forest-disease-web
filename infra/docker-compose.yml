services:
  api:
    build:
      context: ../services/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://forest:forest@postgres:5432/forest_disease}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-forest_local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-forest_local_secret}
      S3_BUCKET: ${S3_BUCKET:-leaf-cases}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - api-uploads:/app/data/uploads

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: forest_disease
      POSTGRES_USER: forest
      POSTGRES_PASSWORD: forest
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forest -d forest_disease"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-forest_local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-forest_local_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
  api-uploads:
